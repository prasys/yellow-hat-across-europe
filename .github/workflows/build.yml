# Builds the host on each system it is meant for, without a game.
#
# The lift of MADEURO.EXE cannot be made here: nobody's disc is in this
# repository and none may be fetched. `make STUB=1` puts an empty lift in its
# place, so what is checked is that src/ and the pinned pcrecomp compile and
# link, that the program starts, and that the launchers build. Whether the
# game plays is still checked by hand with scripts/playtest.sh.
name: build

on:
  push:
    branches: ["Pradeesh/pollock", main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: SDL
        run: brew install sdl2 sdl2_ttf pkgconf
      - name: Engine, with an empty lift
        run: make -j4 STUB=1
      - name: It starts
        run: scripts/smoke.sh build/stub/madeline
      - name: Launcher and app
        run: make STUB=1 app

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make diffutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_ttf
      - name: Engine, with an empty lift
        run: make -j4 STUB=1
      - name: It starts
        run: scripts/smoke.sh build/stub/madeline.exe
      - name: Launcher and app folder
        run: make STUB=1 app

  # Linux: x86-64 and arm64. FluidSynth is installed so the MIDI player in
  # src/midi.c is compiled; the second build checks the program without it.
  linux:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: SDL, FluidSynth, GTK 4
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libfluidsynth-dev libgtk-4-dev
      - name: Engine, with an empty lift
        run: make -j4 STUB=1
      - name: It starts
        run: scripts/smoke.sh build/stub/madeline
      - name: Launcher and app folder
        run: make STUB=1 app
      - name: Engine, without FluidSynth
        run: make clean && make -j4 STUB=1 FLUIDSYNTH=0 && scripts/smoke.sh build/stub/madeline
